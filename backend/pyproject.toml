[project]
name = "noel2026-backend"
version = "1.0.0"
description = "Backend FastAPI du Cluedo Escape de Noël 2026"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
